<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sora Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--surface-0:#ffffff;--surface-100:#eef4ff;--surface-200:#dce8fd;--ink:#14213d;--ink-soft:#3b4a68;--ink-muted:#56688c;--brand-100:#dbe7ff;--brand-300:#93b8ff;--brand-400:#6b9cf5;--brand-500:#3b7bf0;--brand-600:#2563eb;--brand-700:#1d4ed8;--on-brand:#ffffff;--navy-900:#0b1a40;--danger:#e5484d;--danger-100:#ffe4e5;--star:#f5a524;--link:#2563eb;--topbar:rgba(238,244,255,.88);--danger-text:#c4282d;--space-1:4px;--space-2:8px;--space-3:14px;--space-4:20px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--radius-pill:999px;--shadow-card:0 8px 20px rgba(37,99,235,.16);color-scheme:light}
:root[data-theme="dark"]{--surface-0:#152241;--surface-100:#0b1430;--surface-200:#111d3c;--ink:#eaf1ff;--ink-soft:#c3d0ea;--ink-muted:#97a8c9;--brand-100:#1d3263;--brand-300:#93b8ff;--brand-400:#4d7fdc;--brand-500:#5b93ff;--brand-600:#2563eb;--brand-700:#c4d7ff;--on-brand:#ffffff;--navy-900:#050d24;--danger:#ff6b70;--danger-100:#3d1f2e;--star:#f5b544;--link:#8fb4ff;--topbar:rgba(11,20,48,.86);--danger-text:#ff8f93;--shadow-card:0 10px 26px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surface-100);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.ic{display:inline-grid}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic svg .solid{fill:currentColor;stroke:none}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
svg{display:block}
/* welcome */
.welcome{position:fixed;inset:0;overflow:hidden}
.wart,.wart svg{position:absolute;inset:0;width:100%;height:100%}
.wshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,26,64,.85) 0%,rgba(11,26,64,.45) 45%,rgba(11,26,64,0) 70%)}
.wtxt{position:absolute;left:8vw;top:50%;transform:translateY(-50%);color:#fff;max-width:680px}
.hello{font-size:28px;font-weight:400}
.brandname{font-size:clamp(56px,7vw,96px);font-weight:600;letter-spacing:-2px;line-height:1.05;border-bottom:3px solid rgba(255,255,255,.85);display:inline-block;padding-bottom:4px}
.kana{font-size:14px;letter-spacing:18px;opacity:.85;margin-top:10px}
.wtxt p{font-size:17px;line-height:1.6;opacity:.92;margin:24px 0 34px;max-width:420px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:15px;border-radius:var(--radius-pill);padding:12px 28px;border:0;transition:background .15s,transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn .ic svg{width:18px;height:18px}
.btn-lg{font-size:17px;padding:16px 48px}
.btn-primary{background:var(--brand-600);color:var(--on-brand);box-shadow:0 8px 22px rgba(37,99,235,.35)}
.btn-primary:hover{background:#1d4ed8}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.btn-ghost:hover{background:rgba(255,255,255,.28)}
.btn-outline{background:var(--surface-0);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--brand-400)}
.btn-outline:hover{background:var(--brand-100)}
.btn-outline.added{background:var(--brand-100);color:var(--brand-700);box-shadow:none}
.btn.wide{width:100%;margin-top:12px}
.iconround{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.iconround.on{background:#fff;color:var(--danger)}
.iconround.on svg{fill:currentColor}
.iconround.dark{background:rgba(255,255,255,.12);box-shadow:none}
.iconround.dark:hover{background:rgba(255,255,255,.24)}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(14px);border-bottom:1px solid var(--brand-100)}
.topin{display:flex;align-items:center;gap:36px;height:72px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;font-size:20px;font-weight:600;color:var(--ink);flex:none}
.mark{width:28px;height:28px;border-radius:50%;background:var(--brand-600);position:relative;overflow:hidden}
.mark::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:var(--surface-100);left:11px;top:-4px}
.links{display:flex;gap:28px;flex:1}
.lnk{background:none;border:0;font-size:15px;color:var(--ink-muted);padding:24px 0;position:relative;white-space:nowrap}
.lnk:hover{color:var(--ink)}
.lnk.on{color:var(--ink);font-weight:500}
.lnk.on::after{content:'';position:absolute;left:0;right:0;bottom:16px;height:3px;border-radius:3px;background:var(--brand-500)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-0);border-radius:var(--radius-pill);padding:10px 16px;width:300px;color:var(--ink-muted);box-shadow:inset 0 0 0 1.5px var(--brand-100)}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--brand-500)}
.search .ic svg{width:18px;height:18px}
.search input{border:0;outline:0;background:none;font-size:14px;flex:1;min-width:0;color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:var(--brand-600);color:var(--on-brand);font-weight:600;font-size:16px;flex:none}
.main{padding-top:28px;padding-bottom:40px;min-height:70vh}
.foot{font-size:12px;color:var(--ink-muted);padding-top:20px;padding-bottom:32px;border-top:1px solid var(--brand-100)}
/* hero */
.hero{position:relative;height:440px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow-card)}
.hart,.hart svg{position:absolute;inset:0;width:100%;height:100%}
.hshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,26,64,.9) 0%,rgba(11,26,64,.55) 45%,rgba(11,26,64,0) 75%)}
.htxt{position:absolute;left:56px;top:50%;transform:translateY(-50%);color:#fff;max-width:480px}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.htxt h1{font-size:46px;font-weight:600;line-height:1.1;margin:8px 0 10px;letter-spacing:-1px}
.hmeta{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.9}
.htxt p{font-size:14px;line-height:1.65;opacity:.88;margin:14px 0 24px}
.hbtns{display:flex;gap:12px;align-items:center}
.dots{position:absolute;right:28px;bottom:24px;display:flex;gap:8px}
.dots button{width:10px;height:10px;border-radius:5px;border:0;background:rgba(255,255,255,.45);transition:width .2s}
.dots button.on{width:28px;background:#fff}
/* sections */
.shead{display:flex;justify-content:space-between;align-items:baseline;margin:44px 0 18px}
.shead h2{font-size:22px;font-weight:600}
.more{background:none;border:0;color:var(--link);font-size:14px;font-weight:500}
.more:hover{text-decoration:underline}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:28px 22px}
.pcard{background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0}
.pimg{display:block;position:relative;aspect-ratio:3/4;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s}
.pimg svg{width:100%;height:100%}
.pcard:hover .pimg{transform:translateY(-4px);box-shadow:0 14px 30px rgba(37,99,235,.25)}
.phover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,26,64,.25);opacity:0;transition:opacity .2s}
.phover .ic{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--brand-600);place-items:center}
.phover .ic svg{width:22px;height:22px;margin-left:3px}
.pcard:hover .phover{opacity:1}
.pfav{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;z-index:1}
.pfav svg{width:15px;height:15px;fill:var(--danger);stroke:var(--danger);stroke-width:1.8}
.pcard b{display:block;font-size:15px;font-weight:600;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-muted);margin-top:4px}
.pmeta{display:block;font-size:12px;color:var(--ink-muted);margin-top:4px}
.score{background:var(--brand-100);color:var(--brand-700);font-weight:600;font-size:12px;padding:2px 12px;border-radius:var(--radius-pill)}
.score.big{font-size:14px;padding:5px 14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.ccard{display:flex;gap:14px;align-items:center;background:var(--surface-0);border:0;border-radius:var(--radius-md);padding:10px;text-align:left;color:inherit;transition:box-shadow .2s}
.ccard:hover{box-shadow:var(--shadow-card)}
.cimg{position:relative;width:120px;height:72px;border-radius:10px;overflow:hidden;flex:none}.cimg svg{width:100%;height:100%}
.cplay{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--brand-600);display:grid;place-items:center}
.cplay svg{width:14px;height:14px;margin-left:2px}
.cinfo{flex:1;min-width:0}.cinfo b{display:block;font-size:14px}.cinfo small{font-size:12px;color:var(--ink-muted)}
.bar{display:block;height:5px;border-radius:5px;background:var(--brand-100);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand-600)}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.gtile{position:relative;height:110px;border-radius:var(--radius-md);overflow:hidden;border:0;padding:0}
.gtile span,.gtile svg{position:absolute;inset:0;width:100%;height:100%}
.gtile::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,26,64,.75),rgba(11,26,64,.1))}
.gtile b{position:absolute;left:16px;bottom:12px;color:#fff;font-size:17px;font-weight:600;z-index:1}
.gtile:hover svg{transform:scale(1.06);transition:transform .3s}
/* explore */
.phead{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap}
.phead h1{font-size:32px;font-weight:600;letter-spacing:-.5px}
.tabs{display:flex;gap:30px}
.tab{background:none;border:0;font-size:15px;color:var(--ink-muted);padding:8px 0 10px;position:relative}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:500}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--brand-500)}
.filters{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:24px;flex-wrap:wrap}
.gchips{display:flex;flex-wrap:wrap;gap:10px}
.gchip{background:var(--surface-0);border:0;box-shadow:inset 0 0 0 1.5px var(--brand-100);border-radius:var(--radius-pill);padding:8px 18px;font-size:14px}
.gchip:hover{box-shadow:inset 0 0 0 1.5px var(--brand-400)}
.gchip.on{background:var(--brand-600);color:var(--on-brand);box-shadow:none}
.sort{font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:10px}
.sort select{font-size:14px;border:0;border-radius:10px;padding:8px 12px;background:var(--surface-0);box-shadow:inset 0 0 0 1.5px var(--brand-100);color:var(--ink)}
.count{font-size:13px;color:var(--ink-muted);margin:20px 0 18px}
.empty{text-align:center;padding:80px 20px;color:var(--ink-muted)}
.empty p{max-width:380px;margin:14px auto 22px;line-height:1.6}
.eico{width:64px;height:64px;border-radius:50%;background:var(--brand-100);color:var(--link);display:grid;place-items:center;margin:0 auto}
.eico svg{width:28px;height:28px}
/* detail */
.dtop{display:flex;align-items:center;gap:40px;margin-bottom:22px}
.backbtn{display:flex;align-items:center;gap:8px;background:var(--surface-0);border:0;border-radius:var(--radius-pill);padding:9px 18px 9px 12px;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--brand-100)}
.backbtn:hover{box-shadow:inset 0 0 0 1.5px var(--brand-400)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
.dhero{position:relative;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card)}
.dhero svg{width:100%;height:100%}
.play{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--brand-600);display:grid;place-items:center;border:0;box-shadow:0 0 0 12px rgba(255,255,255,.25);transition:transform .2s}
.play:hover{transform:scale(1.08)}
.play svg{width:34px;height:34px;margin-left:4px}
.hbar{position:absolute;left:20px;right:20px;bottom:18px;height:5px;border-radius:5px;background:rgba(255,255,255,.45);overflow:hidden}.hbar i{display:block;height:100%;background:var(--brand-600)}
.dtabs{margin-top:28px;border-bottom:1px solid var(--brand-100)}
.syn{font-size:15px;line-height:1.8;color:var(--ink-soft);margin-top:20px;max-width:720px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
.facts div{background:var(--surface-0);border-radius:var(--radius-md);padding:14px 16px}
.facts dt{font-size:12px;color:var(--ink-muted)}.facts dd{font-size:15px;font-weight:500;margin-top:2px}
.reviews{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.rev{display:flex;gap:14px;background:var(--surface-0);border-radius:var(--radius-md);padding:16px;font-size:14px;line-height:1.6}
.rev b{margin-right:8px}.rev p{color:var(--ink-soft)}
.ravatar{width:40px;height:40px;border-radius:50%;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-weight:600;flex:none}
.stars{display:inline-flex;color:var(--star);vertical-align:-2px}.stars svg{width:14px;height:14px}.stars svg .solid{fill:currentColor}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:20px}
.ep{display:flex;align-items:center;gap:12px;background:var(--surface-0);border:0;border-radius:var(--radius-md);padding:10px;text-align:left}
.ep:hover{box-shadow:var(--shadow-card)}
.eimg{width:88px;height:56px;border-radius:8px;overflow:hidden;flex:none}.eimg svg{width:100%;height:100%}
.etxt{flex:1}.etxt b{display:block;font-size:14px}.etxt small{font-size:12px;color:var(--ink-muted)}
.mini{width:36px;height:36px;border-radius:50%;background:var(--brand-600);color:var(--on-brand);display:grid;place-items:center;flex:none}
.mini svg{width:14px;height:14px;margin-left:2px}
.dside{background:var(--surface-0);border-radius:var(--radius-lg);padding:22px;position:sticky;top:96px;box-shadow:0 2px 10px rgba(37,99,235,.06)}
.sposter{width:120px;aspect-ratio:3/4;border-radius:var(--radius-sm);overflow:hidden}.sposter svg{width:100%;height:100%}
.dside h1{font-size:26px;font-weight:600;line-height:1.2;margin-top:16px;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--ink-muted);margin-top:6px;display:flex;align-items:center;gap:8px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--brand-500)}
.chips{display:flex;gap:8px;align-items:center;margin:16px 0 8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-100);color:var(--brand-700);border-radius:var(--radius-sm);padding:7px 12px;font-size:13px;font-weight:500;border:0}
.chip .ic svg{width:16px;height:16px}
.chip.fav .ic{color:var(--danger)}
.chip.fav:hover{background:var(--danger-100)}
.chip.fav-on{background:var(--danger-100)}
.chip.fav-on .ic svg{fill:var(--danger)}
/* profile */
.profile{display:flex;align-items:center;gap:28px}
.pbig{width:110px;height:110px;border-radius:50%;background:var(--brand-600);color:var(--on-brand);display:grid;place-items:center;font-size:46px;font-weight:600;flex:none}
.plabel{font-size:12px;color:var(--ink-muted)}
.profile input{display:block;font-size:30px;font-weight:600;border:0;background:none;outline:0;border-bottom:2px dashed var(--brand-100);padding:2px 0;width:340px;max-width:100%}
.profile input:focus{border-bottom-color:var(--brand-500)}
.profile .count{margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:36px 0 28px;max-width:760px}
.stats button{background:var(--surface-0);border:0;border-radius:var(--radius-md);padding:22px;text-align:left}
.stats button:hover{box-shadow:var(--shadow-card)}
.stats b{display:block;font-size:32px;color:var(--link)}.stats span{font-size:13px;color:var(--ink-muted)}
/* player */
.player{position:fixed;inset:0;z-index:50;background:#05102a;color:#fff}
.player.opening{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.vart,.vart svg{position:absolute;inset:0;width:100%;height:100%}
.vshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,16,42,.75),rgba(5,16,42,0) 25%,rgba(5,16,42,0) 65%,rgba(5,16,42,.9))}
.vtop{position:absolute;left:32px;top:28px;display:flex;align-items:center;gap:16px}.vtop b{display:block;font-size:20px}.vtop small{font-size:13px;opacity:.8}
.vbig{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--brand-600);display:grid;place-items:center}
.vbig svg{width:38px;height:38px}
.vbottom{position:absolute;left:32px;right:32px;bottom:28px}
.seek{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.3);cursor:pointer}
.seek::before{content:'';position:absolute;inset:-10px 0}
.seek i{display:block;height:100%;border-radius:6px;background:var(--brand-300)}
.seek b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff}
.vctl{display:flex;align-items:center;gap:12px;margin-top:16px}
.vtime{font-size:14px;margin-left:6px;font-variant-numeric:tabular-nums}
.vnote{flex:1;text-align:center;font-size:12px;opacity:.6}
/* responsive */
@media (max-width:1020px){.search{width:220px}.links{gap:20px}.dgrid{grid-template-columns:1fr}.dside{position:static}.facts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
 .wrap{padding:0 16px}
 .topin{flex-wrap:wrap;height:auto;gap:10px 16px;padding-top:12px;padding-bottom:4px}
 .logo{order:1}.tools{order:2;margin-left:auto}.search{order:3;width:100%;flex:none}
 .links{order:4;width:100%;flex:none;gap:22px;overflow-x:auto}
 .hbtns .btn{padding:11px 18px;font-size:14px;white-space:nowrap}.hbtns{flex-wrap:wrap}
 .lnk{padding:10px 0 14px}.lnk.on::after{bottom:6px}
 .hero{height:420px}.htxt{left:24px;right:24px}.htxt h1{font-size:32px}.htxt p{display:none}
 .hshade{background:linear-gradient(0deg,rgba(11,26,64,.9),rgba(11,26,64,.2))}
 .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
 .wtxt{left:24px;right:24px}.wshade{background:linear-gradient(0deg,rgba(11,26,64,.9) 10%,rgba(11,26,64,.2))}.wtxt{top:auto;bottom:48px;transform:none}
 .dtop{gap:16px;flex-wrap:wrap}
 .profile{flex-direction:column;align-items:flex-start}
 .vnote{display:none}.vtop{left:16px}.vbottom{left:16px;right:16px}
}

html{transition:background .25s}
.tools{display:flex;align-items:center;gap:12px;flex:none}
.iconbtn2{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-0);color:var(--ink);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--brand-100)}
.iconbtn2:hover{box-shadow:inset 0 0 0 1.5px var(--brand-400)}
.iconbtn2.light{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.btn-sm{padding:9px 18px;font-size:14px}
.wbtns{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wuser{font-size:14px;opacity:.9}
.wtheme{position:absolute;top:24px;right:28px}
.mbg{position:fixed;inset:0;background:rgba(5,16,42,.55);backdrop-filter:blur(4px);z-index:60;animation:fade .2s}

 return '<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="'+u+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc9ff"/><stop offset=".45" stop-color="#4a7fe0"/><stop offset=".75" stop-color="#16306e"/><stop offset="1" stop-color="#0b1a40"/></linearGradient></defs>'+

 return '<div class="dtop"><button class="backbtn" data-back>'+ic('back')+'Volver</button><div class="tabs">'+[x.g].concat(others).map(function(g,i){return '<button class="tab '+(i===0?'on':'')+'" data-genre="'+g+'">'+g+'</button>';}).join('')+'</div></div>'+

var SERVERS=[{n:'Sora HD',d:'Principal · 1080p'},{n:'Nube',d:'Alternativo · 720p'},{n:'Espejo',d:'Respaldo · 480p',demoFail:true}];
function srvLoad(i,auto){st.server=i;save('server',i);st.srv='loading';st.autoMsg=auto||'';clearTimeout(window._sl);clearInterval(window._ac);
 window._sl=setTimeout(function(){if(!st.playing)return;if(SERVERS[i].demoFail){st.srv='error';drawPlayer();if(st.autoSwitch){st.count=3;window._ac=setInterval(function(){if(!st.playing||st.srv!=='error'){clearInterval(window._ac);return;}st.count--;var c=app.querySelector('#cnt');if(c)c.textContent=st.count;if(st.count<=0){clearInterval(window._ac);srvLoad(nextOk(i),'El reproductor '+SERVERS[i].n+' falló. Cambiamos a '+SERVERS[nextOk(i)].n+'.');}},1000);}}else{st.srv='ok';st.paused=false;drawPlayer();}},900);
 drawPlayer();}
function drawPlayer(){
 var L=app.querySelector('#layer');if(!L)return;
 L.innerHTML=st.playing?player():'';document.body.style.overflow=st.playing?'hidden':'';
 var aw=app.querySelector('#autosw');if(aw)aw.addEventListener('change',function(){st.autoSwitch=aw.checked;rawSave('sora-autosw',st.autoSwitch);});
}
function nextOk(i){for(var k=1;k<=SERVERS.length;k++){var j=(i+k)%SERVERS.length;if(!SERVERS[j].demoFail)return j;}return 0;}
function player(){
 var x=find(st.playing),p=st.progress[x.id]||0,tot=mins(x)*60,s=st.srv,cur=SERVERS[st.server];
 var center=s==='loading'?'<div class="vstate"><span class="spin"></span><b>Conectando con '+cur.n+'…</b></div>':
  s==='error'?'<div class="vstate err"><span class="vwarn">!</span><b>El reproductor '+cur.n+' no responde</b><p>Puede estar caído o lento. Prueba con otro reproductor.</p>'+(st.autoSwitch?'<p class="small">Cambiando a <b>'+SERVERS[nextOk(st.server)].n+'</b> en <span id="cnt">'+(st.count||3)+'</span> s…</p>':'')+'<div class="vbtns">'+SERVERS.map(function(v,i){return i===st.server?'':'<button class="btn btn-primary btn-sm" data-srv="'+i+'">Usar '+v.n+'</button>';}).join('')+'</div></div>':
  '<button class="vbig" data-toggle aria-label="Pausa">'+ic(st.paused?'play':'pause')+'</button>';
 var op=st.opening;st.opening=false;
 return '<div class="player'+(op?' opening':'')+'"><div class="vart '+(s!=='ok'?'dim':'')+'">'+(x.id==='luna'?wide('hero'):scene(x.sc))+'</div><div class="vshade"></div><div class="vtop"><button class="iconround dark" data-closeplayer title="Cerrar (Esc)">'+ic('close')+'</button><div><b>'+x.t+'</b><small>Episodio '+st.ep+' · '+x.g+'</small></div></div>'+
 (st.srvMin&&s!=='error'?'<button class="srvpill" data-srvmin title="Mostrar reproductores"><i class="'+(s==='loading'?'wait':'good')+'"></i>Reproductor: <b>'+cur.n+'</b>'+ic('chev')+'</button>':
 '<div class="srvbox"><div class="srvhead"><span class="srvlbl">Reproductor</span><button class="srvmin" data-srvmin title="Minimizar">'+ic('chev')+'Minimizar</button></div><div class="srvs">'+SERVERS.map(function(v,i){var on=i===st.server,stc=on?(s==='error'?'bad':s==='loading'?'wait':'good'):'';return '<button class="srv '+(on?'on ':'')+stc+'" data-srv="'+i+'" title="'+v.d+'"><i></i><span>'+v.n+'<small>'+v.d+'</small></span></button>';}).join('')+'</div>'+
 '<label class="auto"><input type="checkbox" id="autosw" '+(st.autoSwitch?'checked':'')+'> Cambiar solo si falla</label></div>')+
 (st.autoMsg&&s!=='error'?'<div class="vmsg">'+esc(st.autoMsg)+'</div>':'')+center+
 '<div class="vbottom"><div class="seek" data-seek><i id="vfill" style="width:'+p*100+'%"></i><b id="vknob" style="left:'+p*100+'%"></b></div><div class="vctl"><button class="iconround dark" data-skip="-10" title="-10 s">'+ic('back10')+'</button><button class="iconround dark" data-toggle title="Espacio">'+ic(st.paused||s!=='ok'?'play':'pause')+'</button><button class="iconround dark" data-skip="10" title="+10 s">'+ic('fwd10')+'</button><span class="vtime"><span id="vcur">'+fmt(p*tot)+'</span> / '+fmt(tot)+'</span><span class="vnote">Si un reproductor no carga, elige otro arriba a la derecha.</span><button class="iconround dark '+(st.fav[x.id]?'on':'')+'" data-fav="'+x.id+'" title="Favorito">'+ic('heart')+'</button></div></div></div>';
}
function fmt(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=('0'+s%60).slice(-2);return h?h+':'+('0'+m).slice(-2)+':'+ss:m+':'+ss;}

var app,main;
function overlays(){

 o.innerHTML=(st.auth?authModal():'')+(st.toast?'<div class="toast">'+esc(st.toast)+'</div>':'');
 if(st.toast){clearTimeout(window._tt);window._tt=setTimeout(function(){st.toast='';var t=app.querySelector('.toast');if(t)t.remove();},2800);st.toast='';}

function render(keep){
 applyTheme();
 if(st.page==='welcome'){app.innerHTML=welcome();main=null;overlays();return;}
 if(!main){app.innerHTML=topbar()+'<main class="wrap main" id="main"></main><footer class="wrap foot">Sora Anime · prototipo · ilustraciones originales de muestra</footer><div id="layer"></div>';main=app.querySelector('#main');
  var q=app.querySelector('#q');q.addEventListener('input',function(){st.q=q.value;if(st.q.trim()){if(st.page!=='search'){st.stack.push(snap());st.page='search';}}else if(st.page==='search'){back();return;}draw();});
  q.addEventListener('keydown',function(e){if(e.key==='Escape'){q.value='';st.q='';if(st.page==='search')back();q.blur();}});}

}
function draw(keep){
 var y=window.scrollY,h={home:home,explore:explore,search:search,detail:detail,favs:favs,collection:collection,profile:profile}[st.page]();
 main.innerHTML=h;
 app.querySelectorAll('.lnk').forEach(function(b){b.classList.toggle('on',b.dataset.nav===st.page);});

 overlays();
 document.body.style.overflow=st.playing?'hidden':'';
 window.scrollTo(0,keep?y:0);
 var aw=app.querySelector('#autosw');if(aw)aw.addEventListener('change',function(){st.autoSwitch=aw.checked;rawSave('sora-autosw',st.autoSwitch);});
 var pn=main.querySelector('#pname');if(pn)pn.addEventListener('input',function(){st.name=pn.value.trim()||'Invitado';save('name',st.name);if(USER){USER.name=st.name;rawSave('sora-user',USER);var us=raw('sora-users',{});if(us[USER.email]){us[USER.email].name=st.name;rawSave('sora-users',us);}}var a=app.querySelector('.tools .avatar');if(a)a.textContent=st.name.charAt(0).toUpperCase();});
 var so=main.querySelector('#sort');if(so)so.addEventListener('change',function(){st.sort=so.value;draw(true);});
}
function snap(){return {page:st.page,id:st.id,dtab:st.dtab};}
function go(page,o){st.stack.push(snap());st.page=page;for(var k in o||{})st[k]=o[k];clearSearch();render();}
function back(){var p=st.stack.pop()||{page:'home'};st.page=p.page;st.id=p.id;st.dtab=p.dtab;clearSearch();render();}
function clearSearch(){if(st.page!=='search'){st.q='';var q=app.querySelector('#q');if(q&&document.activeElement!==q)q.value='';}}
function setProg(id,v){st.progress[id]=Math.max(.001,Math.min(1,v));save('progress',st.progress);}
function tick(){if(!st.playing||st.paused||st.srv!=='ok')return;var x=find(st.playing);setProg(x.id,(st.progress[x.id]||0)+1/(mins(x)*60));upd();}
function upd(){var x=find(st.playing),p=st.progress[x.id],f=app.querySelector('#vfill');if(!f)return;f.style.width=p*100+'%';app.querySelector('#vknob').style.left=p*100+'%';app.querySelector('#vcur').textContent=fmt(p*mins(x)*60);}
function start(root){
 app=root;
 app.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-seek],[data-closeauth]');if(!t||!app.contains(t))return;var D=t.dataset;
  if('seek' in D){var r=t.getBoundingClientRect();setProg(st.playing,(e.clientX-r.left)/r.width);upd();return;}
  if('themeToggle' in D||D.setTheme){st.theme=D.setTheme||(st.theme==='dark'?'light':'dark');rawSave('sora-theme',st.theme);applyTheme();if(st.page==='welcome'){var w=app.querySelector('.wtheme');if(w)w.innerHTML=themeBtn('light');}else draw(true);return;}
  if(D.auth){st.auth=D.auth;st.authErr='';overlays();return;}
  if('closeauth' in D){st.auth=null;st.authErr='';overlays();return;}
  if('logout' in D){logout();return;}
  if(t.closest('form'))return;
  if(D.go){st.page=D.go;st.stack=[];render();}
  else if(D.nav){st.stack=[];st.page=D.nav;if(D.nav==='explore'){st.genre=null;}st.playing=null;clearSearch();render();}
  else if(D.open)go('detail',{id:D.open,dtab:'ov'});
  else if('back' in D)back();
  else if(D.genre!==undefined){if(st.page==='explore'){st.genre=D.genre||null;draw(true);}else go('explore',{genre:D.genre||null,kind:'all'});}
  else if(D.list)go('explore',{sort:D.list,genre:null,kind:'all'});
  else if(D.kind){st.kind=D.kind;draw(true);}
  else if(D.dtab){st.dtab=D.dtab;draw(true);}
  else if(D.feat){st.feat=+D.feat;draw(true);}
  else if(D.fav){if(st.fav[D.fav])delete st.fav[D.fav];else st.fav[D.fav]=1;save('fav',st.fav);if(st.playing)drawPlayer();else draw(true);}
  else if(D.col){if(st.col[D.col])delete st.col[D.col];else st.col[D.col]=1;save('col',st.col);draw(true);}
  else if(D.play){st.opening=true;st.playing=D.play;st.ep=+(D.ep||1);st.paused=false;if(!st.progress[D.play])setProg(D.play,.001);srvLoad(st.server,'');}
  else if(D.srv!==undefined){srvLoad(+D.srv,'');}
  else if('srvmin' in D){st.srvMin=!st.srvMin;rawSave('sora-srvmin',st.srvMin);drawPlayer();}
  else if('toggle' in D){if(st.srv!=='ok')return;st.paused=!st.paused;drawPlayer();}
  else if(D.skip){var x=find(st.playing);setProg(x.id,(st.progress[x.id]||0)+(+D.skip)/(mins(x)*60));upd();}
  else if('closeplayer' in D){st.playing=null;st.autoMsg='';clearInterval(window._ac);draw(true);}
  else if('reset' in D){st.fav={};st.col={};st.progress={};if(!USER)st.name='Invitado';['fav','col','progress','name'].forEach(function(k){rawSave(key(k),null);});st.toast='Datos borrados.';draw();}
 });
 document.addEventListener('keydown',function(e){
  if(st.auth&&e.key==='Escape'){st.auth=null;overlays();return;}
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(st.playing){if(e.key==='Escape'){st.playing=null;draw(true);}else if(e.key===' '){e.preventDefault();if(st.srv==='ok'){st.paused=!st.paused;drawPlayer();}}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var x=find(st.playing);setProg(x.id,(st.progress[x.id]||0)+(e.key==='ArrowRight'?10:-10)/(mins(x)*60));upd();}}
  else if(e.key==='Escape'&&st.stack.length&&main)back();
  else if(e.key==='/'&&main){e.preventDefault();app.querySelector('#q').focus();}
 });
 setInterval(tick,1000);setInterval(function(){if(st.page==='home'&&!st.playing&&document.visibilityState==='visible'&&!app.querySelector('.hero:hover')){st.feat++;var h=app.querySelector('.hero');if(h){var y=window.scrollY;draw(true);}}},7000);
 render();
}
window.SoraWeb={start:start};
})();

SoraWeb.start(document.getElementById('app'));</script></body></html>
